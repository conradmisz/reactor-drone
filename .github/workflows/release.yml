name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - uses: actions/cache@v4
        with:
          path: CPP/win-deps
          key: win-deps-${{ hashFiles('CPP/fetch-win-deps.sh') }}
      - run: CPP/fetch-win-deps.sh
      - run: |
          cmake -S CPP -B CPP/build-win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake \
            -DCMAKE_PREFIX_PATH=$PWD/CPP/win-deps -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build CPP/build-win -j
      - run: installer/package-win.sh
      - uses: actions/upload-artifact@v4
        with: { name: stage, path: installer/stage }
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SDL3's cmake refuses to configure with no video backend, and once it
      # finds X11 it hard-errors on any missing X11 sub-dependency (XScrnSaver,
      # XTest, ...) rather than disabling that feature. Install the whole
      # documented set at once — adding them one failure at a time costs a full
      # CI round trip per package. SDL dlopens all of this at runtime, so none
      # of it becomes a requirement on the player's machine.
      # https://wiki.libsdl.org/SDL3/README-linux#build-dependencies
      - run: |
          sudo apt-get update && sudo apt-get install -y \
            libcurl4-openssl-dev libfreetype-dev libharfbuzz-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxrender-dev \
            libxinerama-dev libxxf86vm-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libudev-dev libdbus-1-dev \
            libasound2-dev libpulse-dev
      - uses: actions/cache@v4
        with:
          path: CPP/linux-deps
          key: linux-deps-${{ hashFiles('CPP/fetch-linux-deps.sh') }}
      - run: CPP/fetch-linux-deps.sh
      - run: |
          cmake -S CPP -B CPP/build-portable -DRD_PORTABLE=ON -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PWD/CPP/linux-deps
          cmake --build CPP/build-portable -j
      - run: installer/package-linux.sh
      - name: Smoke test the staged build from an alien cwd
        run: |
          cd / && HOME=$(mktemp -d) SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            $GITHUB_WORKSPACE/installer/stage-linux/run.sh --seed 42 --keys 5:SPACE --stopframe 300
      - name: Tarball (preserves exec bits; upload-artifact does not)
        run: tar czf ReactorDrone-linux-x86_64.tar.gz -C installer/stage-linux .
      - uses: actions/upload-artifact@v4
        with: { name: linux-tarball, path: ReactorDrone-linux-x86_64.tar.gz }
      - name: Push to itch.io
        continue-on-error: true
        env: { BUTLER_API_KEY: '${{ secrets.BUTLER_API_KEY }}' }
        run: |
          curl -fL https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -o butler.zip && chmod +x butler
          ./butler push installer/stage-linux brainstormlabs/reactor-drone:linux --userversion "${GITHUB_REF_NAME#v}"

  # Apple silicon only: GitHub retired the macos-13 image, so there is no Intel
  # macOS runner left to build x86_64 on, and Homebrew on an arm64 runner ships
  # arm64-only SDL3. Restore the matrix if an Intel (or universal) runner ever
  # comes back.
  build-mac:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl3 sdl3_image sdl3_ttf dylibbundler
      - run: |
          cmake -S CPP -B CPP/build-portable -DRD_PORTABLE=ON -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build CPP/build-portable -j3
      - run: installer/package-mac.sh "${GITHUB_REF_NAME#v}"
      - name: Smoke test the bundle from an alien cwd
        run: |
          cd / && HOME=$(mktemp -d) SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            $GITHUB_WORKSPACE/installer/ReactorDrone.app/Contents/MacOS/ReactorDrone \
            --seed 42 --keys 5:SPACE --stopframe 300
      - name: Zip the bundle (ditto keeps exec bits + structure)
        run: ditto -c -k --keepParent installer/ReactorDrone.app ReactorDrone-mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with: { name: 'mac-${{ matrix.arch }}', path: 'ReactorDrone-mac-${{ matrix.arch }}.zip' }
      - name: Push to itch.io
        continue-on-error: true
        env: { BUTLER_API_KEY: '${{ secrets.BUTLER_API_KEY }}' }
        run: |
          curl -fL https://broth.itch.zone/butler/darwin-amd64/LATEST/archive/default -o butler.zip
          unzip -o butler.zip && chmod +x butler
          ./butler push installer/ReactorDrone.app brainstormlabs/reactor-drone:mac-${{ matrix.arch }} --userversion "${GITHUB_REF_NAME#v}"

  release:
    needs: [build-win, build-linux, build-mac]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: stage, path: installer/stage }
      - uses: actions/download-artifact@v4
        with: { name: linux-tarball }
      - uses: actions/download-artifact@v4
        with: { name: mac-arm64 }
      - name: Version from tag
        shell: bash
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Tag matches version.hpp (rc suffix allowed)
        shell: bash
        run: grep -q "\"${VER%%-*}\"" CPP/game/version.hpp
      - run: choco install innosetup -y
      - name: Build installer
        shell: bash
        run: '"/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -DMyAppVersion=$VER installer/reactor-drone.iss'
      - name: Zip portable build
        shell: bash
        run: cd installer/stage && 7z a ../../ReactorDrone-win64.zip .
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Publish outright. This was `draft: true`, which meant every release
          # sat invisible until someone pressed a button in the web UI — the
          # assets existed but every releases/download/<tag>/ URL 404'd, so the
          # website buttons and the in-game updater both pointed at nothing.
          draft: false
          # ...and publishing alone does NOT move the "Latest" badge, so
          # /releases/latest kept serving the PREVIOUS version even once the new
          # one was public. Both of these were fixed by hand on v2.1.0.
          make_latest: true
          files: |
            installer/Output/ReactorDrone-Setup-*.exe
            ReactorDrone-win64.zip
            ReactorDrone-linux-x86_64.tar.gz
            ReactorDrone-mac-arm64.zip
      - name: Push to itch.io
        continue-on-error: true
        shell: bash
        env: { BUTLER_API_KEY: '${{ secrets.BUTLER_API_KEY }}' }
        run: |
          curl -fL https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default -o butler.zip
          7z x butler.zip
          ./butler.exe push installer/stage brainstormlabs/reactor-drone:windows --userversion "$VER"
